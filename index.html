(function(){
 var css=document.createElement('style');
 css.textContent='.rc{margin-inline-start:2px;padding:8px 6px;text-decoration:none;font-size:19px;line-height:1;flex:none}';
 document.head.appendChild(css);

 var HI_W='💧 *فاتورة المياه · Water Invoice*', HI_B='🏢 *فاتورة البلوك C\u200F · Block C Invoice*', HR_W='🧾 *إيصال المياه · Water Receipt*', HR_B='🧾 *إيصال البلوك C\u200F · Block C Receipt*';
 var NOTE='────────────────\n💧 *بنايتنا · Our Building*';
 function num(s){var v=parseFloat(String(s).replace(/[^0-9.]/g,''));return isFinite(v)?Math.round(v*100)/100:0}
 function nf(n){var v=Math.round(Number(n)*100)/100,p=(v%1===0?String(v):v.toFixed(2)).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return p.join('.')}
 function arMon(s){var M={january:'كانون الثاني',february:'شباط',march:'آذار',april:'نيسان',may:'أيار',june:'حزيران',july:'تموز',august:'آب',september:'أيلول',october:'تشرين الأول',november:'تشرين الثاني',december:'كانون الأول'},x=/^\s*([A-Za-z]+)\s+(\d{4})/.exec(String(s||''));return x&&M[x[1].toLowerCase()]?M[x[1].toLowerCase()]+' '+x[2]:String(s||'')}
 function usd(x){return '$'+(Math.round(x*100)/100)}
 function link(ph,msg){return 'https://wa.me/'+ph+'?text='+encodeURIComponent(msg)}
 function wrap(ar,en){var rc=ar.indexOf('إيصال استلام')>-1,bk=ar.indexOf('البلوك C')>-1,HDR=rc?(bk?HR_B:HR_W):(bk?HI_B:HI_W);var t=HDR+'\n\n'+ar+'\n\n'+en+'\n\n'+NOTE;return (bk&&BL()!=='C')?t.replace(/البلوك C/g,'البلوك '+BL()).replace(/Block C/g,'Block '+BL()):t}
 function mk(href){var a=document.createElement('a');a.className='rc';a.href=href;a.target='_blank';a.rel='noopener';a.title='Receipt';a.textContent='🧾';return a}

 /* ---------- Water ---------- */
 function same(x,r){return (r.id&&x.id===r.id)||x.n===r.n}
 function phoneOf(r){
  if(r.ph&&String(r.ph).trim()!=='')return r.ph;
  var f=''; (D.rows||[]).forEach(function(x){if(!f&&x.k==='apt'&&x.ph&&same(x,r))f=x.ph}); return f;
 }
 /* everything this person still owes: other meters this round + earlier rounds */
 function leftWater(r,ro,idx){
  var out=[], rounds=[D].concat(D.hist||[]);
  rounds.forEach(function(rd){
   if((rd.kind==='edl')!==(ro.kind==='edl'))return;
   (rd.rows||[]).forEach(function(x,i){
    if(x.k!=='apt'||!same(x,r)||(rd===ro&&i===idx))return;
    var a=num(x.a);
    if(a>0&&!(rd.paid&&rd.paid[i]))out.push({p:rd.period||'',a:a});
   });
  });
  return out;
 }
 function edlRc(r,ro,idx){
  var p=ro.period||'', a=num(r.a), left=leftWater(r,ro,idx), sum=0, lar='', len='';
  left.forEach(function(x){sum+=x.a;lar+='• '+x.p+': '+nf(x.a)+' دولار\n';len+='• '+x.p+': '+nf(x.a)+' USD\n'});
  var ar='تحية طيبة *'+r.n+'*، 👋\n\n✅ *إيصال استلام* — وصلنا منكم *'+nf(a)+' دولار* عن فاتورة الكهرباء (EDL) — *'+p+'*. ⚡\n\n'
   +(sum?'⚠️ *المتبقي عليكم:*\n'+lar+'*المجموع: '+nf(sum)+' دولار*\n\nيُرجى تسديده عند الإمكان.':'🎉 لا يوجد أي مبلغ متبقٍّ عليكم — كل شيء مسدَّد.')
   +'\n\nنشكر لكم حسن تعاونكم معنا! 🙏✨';
  var en='Hello *'+r.n+'*, 👋\n\n✅ *Payment receipt* — we received *'+nf(a)+' USD* for the EDL (electricity) bill — *'+p+'*. ⚡\n\n'
   +(sum?'⚠️ *Still remaining:*\n'+len+'*Total: '+nf(sum)+' USD*\n\nPlease settle it when you can.':'🎉 Nothing is left to pay — you are all settled.')
   +'\n\nThank you for your valued cooperation! 🙏✨';
  return '🧾 *إيصال الكهرباء · EDL Receipt*\n\n'+ar+'\n\n'+en+'\n\n'+NOTE;
 }
 function waterRc(r,ro,idx){
  var p=ro.period||'', a=num(r.a), left=leftWater(r,ro,idx), sum=0, lar='', len='';
  left.forEach(function(x){sum+=x.a;lar+='• '+x.p+': '+nf(x.a)+' ل.ل.\n';len+='• '+x.p+': '+nf(x.a)+' LBP\n'});
  var ar='تحية طيبة *'+r.n+'*، 👋\n\n✅ *إيصال استلام* — وصلنا منكم *'+nf(a)+' ل.ل.* عن فاتورة المياه للفترة *'+p.replace(' to ',' إلى ')+'*. 💧\n\n'
   +(sum?'⚠️ *المتبقي عليكم:*\n'+lar+'*المجموع: '+nf(sum)+' ل.ل.*\n\nيُرجى تسديده عند الإمكان.':'🎉 لا يوجد أي مبلغ متبقٍّ عليكم — كل شيء مسدَّد.')
   +'\n\nنشكر لكم حسن تعاونكم معنا! 🙏✨';
  var en='Hello *'+r.n+'*, 👋\n\n✅ *Payment receipt* — we received *'+nf(a)+' LBP* for the water bill of the period *'+p+'*. 💧\n\n'
   +(sum?'⚠️ *Still remaining:*\n'+len+'*Total: '+nf(sum)+' LBP*\n\nPlease settle it when you can.':'🎉 Nothing is left to pay — you are all settled.')
   +'\n\nThank you for your valued cooperation! 🙏✨';
  return wrap(ar,en);
 }

 /* ---------- Block C ---------- */
 function bcRc(bc,nm){
  var cols=bc.cols||[], pd=bc.paid||{}, an=(bc.nameAr&&bc.nameAr[nm])||nm;
  var pA='',pE='',lA='',lE='',tp=0,tl=0;
  cols.forEach(function(c){
   var a=(c.ov&&c.ov[nm]!=null)?c.ov[nm]:c.a;
   if(!(a>0))return;
   var ar=c.la||c.l, en=c.l;
   if(pd[c.pk]&&pd[c.pk][nm]){tp+=a;pA+='• '+ar+': '+usd(a)+' ✅\n';pE+='• '+en+': '+usd(a)+' ✅\n'}
   else{tl+=a;lA+='• '+ar+': '+usd(a)+'\n';lE+='• '+en+': '+usd(a)+'\n'}
  });
  if(!(tp>0))return null;
  var ar='تحية طيبة *'+an+'*، 👋\n\nالبلوك C\u200F · *'+arMon(bc.month)+'*\n\n✅ *إيصال استلام* — وصلنا منكم *'+usd(tp)+'*:\n'+pA+'\n'
   +(tl>0?'⚠️ *المتبقي عليكم:*\n'+lA+'*المجموع: '+usd(tl)+'*\n\nيُرجى تسليمه إلى أنس.':'🎉 لا يوجد أي مبلغ متبقٍّ عليكم — كل شيء مسدَّد.')
   +'\n\nنشكر لكم حسن تعاونكم معنا! 🙏✨';
  var en='Hello *'+nm+'*, 👋\n\nBlock C · *'+bc.month+'*\n\n✅ *Payment receipt* — we received *'+usd(tp)+'*:\n'+pE+'\n'
   +(tl>0?'⚠️ *Still remaining:*\n'+lE+'*Total: '+usd(tl)+'*\n\nPlease pass it to Anas.':'🎉 Nothing is left to pay — you are all settled.')
   +'\n\nThank you for your valued cooperation! 🙏✨';
  return wrap(ar,en);
 }

 /* ---------- put the buttons on the page ---------- */
 function addRc(){try{
  if(!window.D)return;
  document.querySelectorAll('#list .row[data-i]').forEach(function(el){
   if(el.querySelector('.rc')||!el.classList.contains('paid'))return;
   var i=+el.getAttribute('data-i'), h=el.getAttribute('data-h');
   var ro=(h!=null)?(D.hist||[])[+h]:D, r=ro&&ro.rows&&ro.rows[i];
   if(!r||r.k!=='apt'||!(num(r.a)>0))return;
   var ph=phoneOf(r); if(!ph)return;
   el.appendChild(mk(link(ph,(ro.kind==='edl'?edlRc:waterRc)(r,ro,i))));
  });
  var bc=D.blockc;
  if(bc&&bc.phones){
   var cards=document.querySelectorAll('#cpanel .apt');
   (bc.names||[]).forEach(function(nm,i){
    var el=cards[i]; if(!el||el.querySelector('.rc'))return;
    var ph=bc.phones[nm]; if(!ph)return;
    var m=bcRc(bc,nm); if(!m)return;
    (el.querySelector('.ah')||el).appendChild(mk(link(ph,m)));
   });
  }
 }catch(e){}}

 /* tapping 🧾 must not tick/untick the row */
 document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.rc'))e.stopPropagation()},true);
 ['render','renderC'].forEach(function(n){
  var o=window[n]; if(typeof o!=='function')return;
  window[n]=function(){var r=o.apply(this,arguments);addRc();return r};
 });
 addRc();
})();
</script>
<script>
/* auto-update: when a newer version of this page is on GitHub, offer a reload */
(function(){
 var shown=false;
 function bar(){
  if(shown)return; shown=true;
  var b=document.createElement('div'); b.id='upd_bar';
  b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#1f6feb;color:#fff;padding:14px 16px;text-align:center;font:600 16px system-ui,sans-serif;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.25)';
  b.innerHTML='🔄 تحديث جديد — اضغط للتحديث<br><span style="font-weight:400;font-size:14px">New version — tap to update</span>';
  b.onclick=function(){location.reload()};
  document.body.appendChild(b);
 }
 function chk(){if(shown)return;fetch('./?appv='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){if(t.indexOf("APPV='"+APPV+"'")<0&&/APPV='/.test(t))bar()}).catch(function(){})}
 setInterval(chk,300000);
 document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()});
})();
</script>
</body></html>
